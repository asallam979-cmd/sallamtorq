name: Apply navigation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="menu"><a href="#models">Models ▾</a><div class="dropdown"><a href="#motorcycles">🏍️ MOTORCYCLES</a><a href="#racing-models">🏁 RACING MOTORCYCLES</a><a href="#jets-models">🌊 JETS / PWC</a><a href="#buggy-models">🏎️ BUGGIES / UTV</a><a href="#scooters-models">🛵 SCOOTERS</a></div></div>'''
          new='<a href="models-catalog.html">Models</a>'
          if old in s: s=s.replace(old,new,1)
          old='''<div class="menu"><a href="#parts">Parts ▾</a><div class="dropdown"><a href="racing-parts.html">🏁 RACING PARTS</a><a href="#parts">🌊 WATER / JET PARTS</a></div></div>'''
          new='<a href="racing-parts.html">Parts</a>'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Keep the same direct navigation on the model/catalog pages.
          for name in ['models-catalog.html','models.html']:
            q=Path(name)
            if q.exists():
              t=q.read_text(encoding='utf-8')
              t=t.replace('href="index.html#parts"','href="racing-parts.html"')
              q.write_text(t,encoding='utf-8')
          PY
      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html models-catalog.html models.html
          git diff --cached --quiet || git commit -m "Fix direct Models and Parts navigation"
          git push
