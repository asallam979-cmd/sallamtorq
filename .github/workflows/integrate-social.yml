name: Integrate Social Catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Social destination to homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section id="hub" class="hub"><div class="hub-head"><div><small>EXPLORE SALLAM TORQ</small><h2 style="margin:12px 0 0;font-size:clamp(36px,5vw,66px)">ONE BRAND.<br><em>SIX WORLDS.</em></h2></div>'
          new = '<section id="hub" class="hub"><div class="hub-head"><div><small>EXPLORE SALLAM TORQ</small><h2 style="margin:12px 0 0;font-size:clamp(36px,5vw,66px)">ONE BRAND.<br><em>SEVEN DESTINATIONS.</em></h2></div>'
          if old in s:
              s = s.replace(old, new, 1)
          marker = '<a class="hub-card" data-mark="07" href="social.html">'
          if marker not in s:
              anchor = '<a class="hub-card" data-mark="03" href="service.html">'
              social = '<a class="hub-card social-card" data-mark="03" href="social.html"><small>03 / CONNECT</small><h3>SOCIAL</h3><p>Instagram, TikTok, Facebook and direct WhatsApp channels for SALLAM TORQ.</p><span class="hub-arrow">↗</span></a>'
              s = s.replace(anchor, social + anchor.replace('data-mark="03"', 'data-mark="04"'), 1)
              s = s.replace('data-mark="04" href="performance-tuning.html"', 'data-mark="05" href="performance-tuning.html"', 1)
              s = s.replace('data-mark="05" href="#faq"', 'data-mark="06" href="#faq"', 1)
              s = s.replace('data-mark="06" href="#brand"', 'data-mark="07" href="#brand"', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed"
          else
            git commit -m "Add Social catalog to homepage"
            git push
          fi
