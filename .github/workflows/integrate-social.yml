name: Integrate Social Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved homepage and build professional navigation
        shell: bash
        run: |
          git fetch origin baseline-2026-09-09 --depth=1
          git show FETCH_HEAD:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<a href="#brand">The Brand</a></nav>'
          new = '<a href="#brand">The Brand</a><a href="social.html">Social</a></nav>'
          if old not in s:
              raise SystemExit('Approved baseline navigation marker not found')
          s = s.replace(old, new, 1)

          css_old = 'header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:26px;padding:18px 5%;background:rgba(10,10,10,.94);backdrop-filter:blur(10px);border-bottom:1px solid #222}'
          css_new = 'header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:16px 4.5%;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid #222}'
          s = s.replace(css_old, css_new, 1)

          nav_old = 'nav{display:flex;gap:18px;flex:1;justify-content:center}'
          nav_new = 'nav{display:flex;gap:20px;flex:1;justify-content:center;align-items:center;min-width:0}'
          s = s.replace(nav_old, nav_new, 1)

          link_old = 'nav>a,nav .menu>a{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#aaa}'
          link_new = 'nav>a,nav .menu>a{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#a8a8a8;white-space:nowrap;padding:8px 0;position:relative}nav>a:after,nav .menu>a:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--red);transform:scaleX(0);transform-origin:center;transition:.2s}nav>a:hover:after,nav .menu>a:hover:after{transform:scaleX(1)}'
          s = s.replace(link_old, link_new, 1)

          mobile_old = '@media(max-width:900px){nav{display:none}.header-search{flex:1}.header-search input{width:auto;flex:1}.split{grid-template-columns:1fr;gap:35px}}'
          mobile_new = '@media(max-width:900px){header{flex-wrap:wrap;gap:12px;padding:14px 4%}.logo{margin-right:auto}nav{order:3;flex-basis:100%;width:100%;overflow-x:auto;justify-content:flex-start;gap:22px;padding:3px 2px 7px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.header-search{flex:0 1 180px}.header-search input{width:auto;flex:1}.cta{display:none}.split{grid-template-columns:1fr;gap:35px}}'
          if mobile_old not in s:
              raise SystemExit('Expected responsive navigation rule not found')
          s = s.replace(mobile_old, mobile_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed"
          else
            git commit -m "Make homepage navigation professional and responsive"
            git push
          fi
