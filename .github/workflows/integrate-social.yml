name: Integrate Social Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved homepage and add Social only
        shell: bash
        run: |
          git fetch origin baseline-2026-09-09 --depth=1
          git show FETCH_HEAD:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="#brand">The Brand</a></nav>'
          new = '<a href="#brand">The Brand</a><a href="social.html">Social</a></nav>'
          if old not in s:
              raise SystemExit('Approved baseline navigation marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed"
          else
            git commit -m "Restore approved homepage and add Social only"
            git push
          fi
