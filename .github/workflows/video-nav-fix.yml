name: Match navigation to video
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared video-style navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          nav = '''<header class="st-video-nav"><a class="st-logo" href="index.html">SA<span>.TORQ</span></a><nav><a href="models-catalog.html">Models</a><a href="racing-parts.html">Parts</a><a href="index.html#riders">Riders</a><a href="service.html">Service</a><a href="performance-tuning.html">Performance Tuning</a><a href="faq.html">FAQ</a><a href="index.html#brand">The Brand</a></nav><a class="st-cta" href="index.html#test">BOOK A TEST RIDE</a></header>'''
          css = '''<style id="st-video-nav-style">.st-video-nav{position:sticky;top:0;z-index:999;display:flex;align-items:center;gap:26px;padding:18px 5%;background:rgba(10,10,10,.96);backdrop-filter:blur(10px);border-bottom:1px solid #222;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}.st-video-nav a{text-decoration:none}.st-logo{font-weight:900;letter-spacing:-.5px;font-size:20px;color:#f2f2f2;white-space:nowrap}.st-logo span{color:#e10600}.st-video-nav nav{display:flex;gap:clamp(12px,1.55vw,22px);flex:1;justify-content:center;align-items:center}.st-video-nav nav a{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;white-space:nowrap}.st-video-nav nav a:hover{color:#fff}.st-cta{display:inline-block;background:#e10600;color:#fff;padding:12px 17px;font-weight:800;font-size:10px;letter-spacing:1px;white-space:nowrap}.st-video-nav + *{box-sizing:border-box}.top{display:none!important}@media(max-width:900px){.st-video-nav nav{display:none}.st-video-nav{gap:16px}.st-cta{margin-left:auto}}@media(max-width:600px){.st-video-nav{padding:15px 5%}.st-cta{font-size:9px;padding:10px 12px}.st-logo{font-size:18px}}</style>'''

          files = ['models-catalog.html','models.html','racing-parts.html']
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'id="st-video-nav-style"' not in s:
                  s=s.replace('</head>', css+'</head>', 1)
              if '<header class="st-video-nav">' not in s:
                  s=s.replace('<body>', '<body>'+nav, 1)
              p.write_text(s,encoding='utf-8')

          # Make the homepage nav order exactly match the video: Models / Parts / Riders / Service / Tuning / FAQ / Brand.
          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          old='''@media(min-width:901px){nav>.menu:nth-child(1){order:1}nav>a:nth-child(2){order:2}nav>a:nth-child(3){order:3}nav>.menu:nth-child(4){order:4}nav>a:nth-child(5){order:5}nav>a:nth-child(6){order:6}nav>a:nth-child(7){order:7}}'''
          new='''@media(min-width:901px){header nav>a:nth-child(1){order:1}header nav>a:nth-child(2){order:3}header nav>a:nth-child(3){order:4}header nav>a:nth-child(4){order:2}header nav>a:nth-child(5){order:5}header nav>a:nth-child(6){order:6}header nav>a:nth-child(7){order:7}}'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models-catalog.html models.html racing-parts.html styles.css
          git diff --cached --quiet || git commit -m "Match Models and Parts navigation to video"
          git push
