<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALLAM TORQ — Catalog Integration Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="site" src="../index.html?v=5624d05" title="SALLAM TORQ"></iframe><script>const MODELS='../models.html?v=4d43e982',PARTS='../racing-parts.html',SERVICE='../service.html';const frame=document.getElementById('site');function wire(){const d=frame.contentDocument;if(!d)return;d.querySelectorAll('a').forEach(a=>{const h=a.getAttribute('href')||'';if(h.includes('#models')){a.href=MODELS;a.onclick=e=>{e.preventDefault();parent.location.href=MODELS}}else if(h.includes('#parts')){a.href=PARTS;a.onclick=e=>{e.preventDefault();parent.location.href=PARTS}}else if(h.includes('#service')){a.href=SERVICE;a.onclick=e=>{e.preventDefault();parent.location.href=SERVICE}}});}frame.addEventListener('load',wire);setTimeout(wire,500);setTimeout(wire,1500);</script></body></html>
