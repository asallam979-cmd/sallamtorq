<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALLAM TORQ — Catalog Integration Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="site" src="../index.html?v=5624d05" title="SALLAM TORQ"></iframe><script>const MODELS='https://asallam979-cmd.github.io/sallamtorq/models.html?v=4d43e982';const PARTS='https://asallam979-cmd.github.io/sallamtorq/racing-parts.html';const SERVICE='https://asallam979-cmd.github.io/sallamtorq/service-fixed.html';const frame=document.getElementById('site');function wire(){const d=frame.contentDocument;if(!d)return;d.querySelectorAll('a').forEach(a=>{const h=a.getAttribute('href')||'';if(h==='#models'||h.includes('#models')){a.href=MODELS;a.onclick=e=>{e.preventDefault();location.href=MODELS}}else if(h==='#parts'||h.includes('#parts')){a.href=PARTS;a.onclick=e=>{e.preventDefault();location.href=PARTS}}else if(h==='#service'||h.includes('#service')){a.href=SERVICE;a.onclick=e=>{e.preventDefault();location.href=SERVICE}}});}frame.addEventListener('load',wire);setTimeout(wire,500);</script></body></html>
