<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALLAM TORQ — Catalog Integration Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="site" src="../index.html?v=5624d05" title="SALLAM TORQ"></iframe><script>const HOME='../index.html?v=5624d05',MODELS='../models.html?v=4d43e982',PARTS='../racing-parts.html',SERVICE='../service-fixed.html';const frame=document.getElementById('site');let current='home';function setView(view,push=true){current=view;const src=view==='models'?MODELS:view==='parts'?PARTS:view==='service'?SERVICE:HOME;if(push)history.pushState({view},'',view==='home'?'#home':'#'+view);frame.src=src;}function wire(){const d=frame.contentDocument;if(!d)return;d.querySelectorAll('a').forEach(a=>{if(a.dataset.torqWired)return;const text=(a.textContent||'').trim().toLowerCase();const href=(a.getAttribute('href')||'').toLowerCase();let view=null;if(text.includes('models')||href.includes('models.html')||href==='#models')view='models';else if(text.includes('parts')||href.includes('racing-parts.html')||href==='#parts')view='parts';else if(text.includes('service')||href.includes('service.html')||href==='#service')view='service';if(view){a.dataset.torqWired='1';a.addEventListener('click',e=>{e.preventDefault();setView(view,true);});}});}frame.addEventListener('load',()=>{setTimeout(wire,50);});window.addEventListener('popstate',e=>{const v=e.state&&e.state.view?e.state.view:'home';setView(v,false);});history.replaceState({view:'home'},'',location.pathname+'#home');setInterval(wire,500);</script></body></html>
